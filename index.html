<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b19"><meta name="description" content="Jump. Switch. Survive. A neon arcade platformer.">
<link rel="icon" href="data:,"><title>Neon Dash</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="viewport" id="viewport" aria-label="Neon Dash game">
<canvas id="game" aria-label="Playfield. Space or tap to jump. X or Shift to switch color."></canvas>
<div class="hud"><div class="run-stats"><span>ATTEMPT <b id="attempt">01</b></span><span>BEST <b id="best">0<span>m</span></b></span></div><div class="progress"><span id="levelText">LEVEL 01</span><div class="progress-track"><div id="progressFill"></div></div><span id="progressText">0m</span></div><div class="hud-actions"><button class="icon-button" id="soundBtn" aria-label="Enable sound" aria-pressed="false" title="Toggle sound">♪</button><button class="icon-button" id="pauseBtn" aria-label="Pause game" title="Pause (P)">Ⅱ</button></div></div>
<div class="game-overlay" id="overlay"><div class="menu"><span class="overlay-kicker" id="overlayKicker">ENDLESS / NEW CIRCUIT EVERY RUN</span><h1 id="overlayTitle">NEON<span>DASH</span></h1><p id="overlayDescription">Jump the spikes. Switch your color.<br>Gold is always solid.</p><button class="primary-button" id="playBtn"><span id="playLabel">PLAY</span><span aria-hidden="true">▶</span></button><span class="overlay-hint" id="overlayHint">press <kbd>SPACE</kbd> to start</span><div class="achievement-summary"><span id="achievementUnlock"></span><p id="achievementGoal"></p></div><div class="menu-controls"><span><kbd>SPACE / ↑</kbd> JUMP</span><span><kbd>X / SHIFT</kbd> SWITCH</span></div></div></div>
<div class="pause-overlay" id="pauseOverlay" hidden><div class="menu"><span class="overlay-kicker">TAKE A BREATH</span><h2>PAUSED</h2><button class="primary-button" id="resumeBtn">RESUME <span aria-hidden="true">▶</span></button><button class="text-button" id="restartBtn">↻ RESTART</button><div class="menu-controls"><span><kbd>SPACE / ↑</kbd> JUMP</span><span><kbd>X / SHIFT</kbd> SWITCH</span></div><small class="audio-credit">SPACE CITY · MINTODOG / SFX · CRAZYDUCKGAMES · CC0</small></div></div>
<button id="jumpBtn" class="jump-button" aria-label="Jump" hidden>↑<span>JUMP</span></button>
<div class="sr-only" id="status" aria-live="polite"></div>
</main>
<script type="module" src="main.js"></script>
</body></html>

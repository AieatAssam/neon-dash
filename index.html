<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b19"><meta name="description" content="Jump. Switch. Survive. A neon arcade runner.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" href="./icons/icon-192.png" type="image/png"><title>Neon Dash</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="viewport" id="viewport" aria-label="Neon Dash game">
<canvas id="game" aria-label="Playfield. Space or tap to jump. X or Shift to switch color."></canvas>
<div class="hud" id="hud">
  <div class="progress" id="progress"><div class="progress-track"><div id="progressFill"></div><i id="bestMark" hidden></i></div><span id="progressText">0%</span></div>
  <div class="hud-actions"><button class="icon-button" id="soundBtn" aria-label="Mute sound" aria-pressed="true" title="Sound">♫</button><button class="icon-button" id="pauseBtn" aria-label="Pause game" aria-pressed="false" title="Pause (P)" hidden>Ⅱ</button></div>
</div>
<div class="practice-badge" id="practiceBadge" hidden>PRACTICE</div>
<div class="banner" id="banner" role="status" hidden></div>
<div class="teach" id="teach" role="status" hidden></div>
<div class="game-overlay" id="overlay">
  <div class="menu title-card" id="titleCard">
    <h1 class="logo" id="overlayTitle"><span class="logo-neon">NEON</span><span class="logo-dash">DASH</span></h1>
    <span class="best-line" id="bestLine"></span>
    <button class="primary-button" id="playBtn"><span id="playLabel">PLAY</span></button>
    <fieldset class="mode-chips" aria-label="Mode">
      <label><input type="radio" name="gameMode" value="challenge" checked><span>LEVEL</span></label>
      <label><input type="radio" name="gameMode" value="endless"><span>ENDLESS</span></label>
      <label><input type="radio" name="gameMode" value="practice"><span>PRACTICE</span></label>
    </fieldset>
    <p class="hint" id="overlayHint">Tap to jump</p>
  </div>
  <div class="menu result-card" id="resultCard" hidden>
    <span class="result-kicker" id="resultKicker">ATTEMPT 1</span>
    <div class="result-score" id="resultScore">0%</div>
    <span class="result-best" id="resultBest"></span>
    <button class="primary-button" id="retryBtn"><span>RETRY</span></button>
    <button class="text-button" id="menuBtn">MENU</button>
  </div>
</div>
<div class="pause-overlay" id="pauseOverlay" hidden><div class="menu">
  <h2>PAUSED</h2>
  <button class="primary-button" id="resumeBtn"><span>RESUME</span></button>
  <div class="pause-row"><button class="text-button" id="restartBtn">RESTART</button><button class="text-button" id="titleBtn">MENU</button></div>
  <div class="pause-row"><button class="toggle" id="vibrationBtn" aria-pressed="true" hidden>VIBRATION ON</button></div>
  <small class="audio-credit">MUSIC · SPACE CITY BY MINTODOG · CC0</small>
</div></div>
<button id="phaseBtn" class="phase-button" aria-label="Switch color" hidden><span class="phase-dot"></span></button>
<button id="jumpBtn" class="jump-button" aria-label="Jump" hidden>▲</button>
<div class="sr-only" id="status" aria-live="polite"></div>
</main>
<script type="module" src="/main.ts"></script>
</body></html>
